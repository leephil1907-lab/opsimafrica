<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1120" role="img" aria-labelledby="title"><title id="title">Product page information wireframe</title><rect width="100%" height="100%" rx="14" fill="#F6F7F9"/><style>text{font-family:Arial,sans-serif;fill:#0F1B2A;font-size:16px}.small{font-size:12px;fill:#536174}</style><rect x="24" y="22" width="952" height="64" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="40" y="49" font-weight="700">Header / product page</text><text class="small" x="40" y="71">Clear navigation and persistent Book a Demo CTA</text><rect x="24" y="108" width="952" height="108" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="40" y="135" font-weight="700">01 / Product introduction</text><text class="small" x="40" y="157">A practical training room for your operations team.</text><rect x="24" y="238" width="460" height="170" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="40" y="265" font-weight="700">02 / Stockroom concept</text><text class="small" x="40" y="287">Central table, health / grocery shelves, quarantine.</text><rect x="506" y="238" width="470" height="170" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="522" y="265" font-weight="700">Available receiving lesson</text><text class="small" x="522" y="287">8 cartons · 6-minute target · hands-only.</text><text class="small" x="522" y="306">Try practice lab · watch walkthrough.</text><rect x="24" y="430" width="952" height="154" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="40" y="457" font-weight="700">03 / Actual desktop product screenshots</text><text class="small" x="40" y="479">Inspector → item-level quantity record → saved scorecard.</text><text class="small" x="40" y="498">Full-size images available; not headset-footage claims.</text><rect x="24" y="606" width="952" height="100" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="40" y="633" font-weight="700">04 / Five skills</text><text class="small" x="40" y="655">Inspect · Sort · Flag · Record · Improve</text><rect x="24" y="728" width="460" height="150" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="40" y="755" font-weight="700">05 / Hands-only explanation</text><text class="small" x="40" y="777">Pinch, grab, rotate, release and poke.</text><text class="small" x="40" y="796">Seated / stationary settings; hardware gate.</text><rect x="506" y="728" width="470" height="150" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="522" y="755" font-weight="700">Portable tablet concept</text><text class="small" x="522" y="777">Large + / − · condition · disposition.</text><text class="small" x="522" y="796">Save line; Review → Confirm after all lines.</text><rect x="24" y="900" width="952" height="100" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="40" y="927" font-weight="700">06 / Fixed 100-point rubric + coaching</text><text class="small" x="40" y="949">35 accuracy / 25 exceptions / 25 process / 15 efficiency. Two next priorities.</text><rect x="24" y="1022" width="952" height="74" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="40" y="1049" font-weight="700">07 / Request a business demo + footer</text><text class="small" x="40" y="1071">No guaranteed outcomes. Privacy and product limits remain visible.</text></svg>