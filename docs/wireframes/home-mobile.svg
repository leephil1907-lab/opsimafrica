<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1540" role="img" aria-labelledby="title"><title id="title">Mobile homepage information wireframe</title><rect width="100%" height="100%" rx="14" fill="#F6F7F9"/><style>text{font-family:Arial,sans-serif;fill:#0F1B2A;font-size:16px}.small{font-size:12px;fill:#536174}</style><rect x="16" y="18" width="358" height="64" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="32" y="45" font-weight="700">Header</text><text class="small" x="32" y="67">Wordmark · compact CTA · menu</text><rect x="16" y="104" width="358" height="218" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="32" y="131" font-weight="700">01 / Hero, one column</text><text class="small" x="32" y="153">34–44 px headline.</text><text class="small" x="32" y="172">Practical training subhead.</text><text class="small" x="32" y="191">Book a Demo</text><text class="small" x="32" y="210">Watch the 60-second Demo</text><rect x="16" y="344" width="358" height="190" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="32" y="371" font-weight="700">Illustrative headset visual</text><text class="small" x="32" y="393">Image first, clear illustration caption.</text><text class="small" x="32" y="412">Feedback card: catch errors safely.</text><rect x="16" y="556" width="358" height="87" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="32" y="583" font-weight="700">Outcome strip</text><text class="small" x="32" y="605">Three vertically stacked icon + text statements.</text><rect x="16" y="665" width="358" height="150" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="32" y="692" font-weight="700">02 / Problem + benefit cards</text><text class="small" x="32" y="714">Safe practice</text><text class="small" x="32" y="733">Consistent training</text><text class="small" x="32" y="752">Measurable readiness</text><rect x="16" y="837" width="358" height="114" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="32" y="864" font-weight="700">03 / Four-step walkthrough</text><text class="small" x="32" y="886">Two-by-two steps.</text><text class="small" x="32" y="905">No horizontal scroll.</text><rect x="16" y="973" width="358" height="114" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="32" y="1000" font-weight="700">04 / First scenario</text><text class="small" x="32" y="1022">Short explanation and checklist.</text><text class="small" x="32" y="1041">Stockroom concept below copy.</text><rect x="16" y="1109" width="358" height="114" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="32" y="1136" font-weight="700">05 / Manager view</text><text class="small" x="32" y="1158">Stacked copy and illustrative scorecard.</text><text class="small" x="32" y="1177">No fabricated business outcomes.</text><rect x="16" y="1245" width="358" height="102" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="32" y="1272" font-weight="700">06 / Audiences</text><text class="small" x="32" y="1294">Two-by-two audience cards.</text><text class="small" x="32" y="1313">Roadmap limits visible.</text><rect x="16" y="1369" width="358" height="147" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="32" y="1396" font-weight="700">07 / CTA + footer</text><text class="small" x="32" y="1418">Request a Demo.</text><text class="small" x="32" y="1437">Useful product / privacy links.</text><text class="small" x="32" y="1456">No unverified public contact details.</text></svg>