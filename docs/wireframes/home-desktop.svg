<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1230" role="img" aria-labelledby="title"><title id="title">Desktop homepage information wireframe</title><rect width="100%" height="100%" rx="14" fill="#F6F7F9"/><style>text{font-family:Arial,sans-serif;fill:#0F1B2A;font-size:16px}.small{font-size:12px;fill:#536174}</style><rect x="24" y="22" width="952" height="64" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="40" y="49" font-weight="700">Header / navigation</text><text class="small" x="40" y="71">Wordmark · Product · Scenarios · For businesses · Why OpsSim · Book a Demo</text><rect x="24" y="108" width="460" height="240" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="40" y="135" font-weight="700">01 / Business-first hero</text><text class="small" x="40" y="157">Train your team before mistakes cost you money.</text><text class="small" x="40" y="176">Practical VR training for African operations teams.</text><text class="small" x="40" y="195">Primary: Book a Demo</text><text class="small" x="40" y="214">Secondary: Watch the 60-second Demo</text><rect x="506" y="108" width="470" height="240" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="522" y="135" font-weight="700">Illustrative headset / receiving scene</text><text class="small" x="522" y="157">Grounded stockroom, fictional African trainee.</text><text class="small" x="522" y="176">Clear illustration disclosure. No fake staff / pilot claim.</text><rect x="24" y="370" width="952" height="65" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="40" y="397" font-weight="700">02 / Three practical outcomes</text><text class="small" x="40" y="419">Quicker onboarding intent · spotting errors · readiness measurement</text><rect x="24" y="457" width="952" height="115" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="40" y="484" font-weight="700">03 / The problem + three benefits</text><text class="small" x="40" y="506">Safe practice · standardise training · measure readiness</text><rect x="24" y="594" width="952" height="100" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="40" y="621" font-weight="700">04 / Four-step walkthrough</text><text class="small" x="40" y="643">Receive a scenario → inspect and sort → flag exceptions → submit and improve</text><rect x="24" y="716" width="460" height="130" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="40" y="743" font-weight="700">05 / First available scenario</text><text class="small" x="40" y="765">Eight-carton BrightMart receiving.</text><text class="small" x="40" y="784">Correct partial-stock handling. Harder replay.</text><rect x="506" y="716" width="470" height="130" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="522" y="743" font-weight="700">Stockroom concept</text><text class="small" x="522" y="765">Left health shelf · right grocery shelf · quarantine.</text><text class="small" x="522" y="784">Central table, task panel and portable tablet.</text><rect x="24" y="868" width="952" height="115" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="40" y="895" font-weight="700">06 / Illustrative manager scorecard</text><text class="small" x="40" y="917">Saved score · active time · exceptions · two coaching priorities. Clearly marked example.</text><rect x="24" y="1005" width="952" height="84" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="40" y="1032" font-weight="700">07 / Four audiences</text><text class="small" x="40" y="1054">Retail · pharmacy (non-clinical) · warehouses · logistics (roadmap labelled)</text><rect x="24" y="1111" width="952" height="94" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="40" y="1138" font-weight="700">08 / Final CTA + trust / footer</text><text class="small" x="40" y="1160">Book a Demo · privacy · notices · practice-not-promises disclosure. No invented contacts.</text></svg>