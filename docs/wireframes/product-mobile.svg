<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1650" role="img" aria-labelledby="title"><title id="title">Mobile product page information wireframe</title><rect width="100%" height="100%" rx="14" fill="#F6F7F9"/><style>text{font-family:Arial,sans-serif;fill:#0F1B2A;font-size:16px}.small{font-size:12px;fill:#536174}</style><rect x="16" y="18" width="358" height="64" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="32" y="45" font-weight="700">Header / product page</text><text class="small" x="32" y="67">Wordmark · Book a Demo · menu</text><rect x="16" y="104" width="358" height="154" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="32" y="131" font-weight="700">01 / Product introduction</text><text class="small" x="32" y="153">Practical VR receiving practice.</text><text class="small" x="32" y="172">Stack demo and practice CTAs.</text><text class="small" x="32" y="191">Keep the availability label visible.</text><rect x="16" y="280" width="358" height="150" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="32" y="307" font-weight="700">02 / Receiving workspace</text><text class="small" x="32" y="329">Central table and eye-level task panel.</text><text class="small" x="32" y="348">Health left · grocery right.</text><text class="small" x="32" y="367">Separate quarantine and portable tablet.</text><rect x="16" y="452" width="358" height="110" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="32" y="479" font-weight="700">Available receiving lesson</text><text class="small" x="32" y="501">8 cartons · standard 6-minute target.</text><text class="small" x="32" y="520">Start practice; hardware limits disclosed.</text><rect x="16" y="584" width="358" height="120" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="32" y="611" font-weight="700">03 / Actual inspector capture</text><text class="small" x="32" y="633">First screenshot in a vertical stack.</text><text class="small" x="32" y="652">Tap to view a full-size desktop image.</text><text class="small" x="32" y="671">Not physical headset footage.</text><rect x="16" y="726" width="358" height="120" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="32" y="753" font-weight="700">Item-level record capture</text><text class="small" x="32" y="775">Large received-quantity + / − controls.</text><text class="small" x="32" y="794">Accept 22 sound units; record shortage 2.</text><text class="small" x="32" y="813">Condition and disposition remain clear.</text><rect x="16" y="868" width="358" height="120" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="32" y="895" font-weight="700">Saved scorecard capture</text><text class="small" x="32" y="917">Score, exceptions and coaching.</text><text class="small" x="32" y="936">Two improvements and comparable replay.</text><text class="small" x="32" y="955">Desktop capture, not pilot outcomes.</text><rect x="16" y="1010" width="358" height="124" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="32" y="1037" font-weight="700">04 / Five practical skills</text><text class="small" x="32" y="1059">Inspect · Sort · Flag</text><text class="small" x="32" y="1078">Record · Improve</text><text class="small" x="32" y="1097">Stack cards without horizontal scrolling.</text><rect x="16" y="1156" width="358" height="168" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="32" y="1183" font-weight="700">05 / Hands-only explanation</text><text class="small" x="32" y="1205">Ray-pinch menus; grab and rotate.</text><text class="small" x="32" y="1224">Drag and release; poke + / − controls.</text><text class="small" x="32" y="1243">Seated / stationary, one-hand essentials.</text><text class="small" x="32" y="1262">Real-headset acceptance still required.</text><rect x="16" y="1346" width="358" height="134" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="32" y="1373" font-weight="700">06 / Fixed rubric and coaching</text><text class="small" x="32" y="1395">35 accuracy · 25 exceptions</text><text class="small" x="32" y="1414">25 process · 15 efficiency</text><text class="small" x="32" y="1433">Review then Confirm, saved next steps.</text><rect x="16" y="1502" width="358" height="126" rx="7" fill="#FFFFFF" stroke="#94A5B5" stroke-width="1.2"/><text x="32" y="1529" font-weight="700">07 / Request demo + footer</text><text class="small" x="32" y="1551">Primary Book a Demo CTA.</text><text class="small" x="32" y="1570">Request receipt, not automatic booking.</text><text class="small" x="32" y="1589">Privacy, responsible use and clear limits.</text></svg>